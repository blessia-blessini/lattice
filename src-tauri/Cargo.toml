[package]
name = "lattice"
version = "0.3.50"
description = "A Markdown Editor that respects standards"
license = "AGPL-3.0-or-later"
authors = ["Blessia Blessini"]
edition = "2024"
default-run = "lattice"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# E2E desktop harness build.
# Activates the E2E shutdown / startup signal hooks and strips devUrl from the
# embedded Tauri config so the binary loads dist/ assets instead of localhost.
# Usage: cargo build --bin lattice --features e2e_test
#        cargo run  --example e2e_harness --features e2e_test   (harness itself needs no feature)
e2e_test = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.0"
sha2 = "0.10"
base64 = "0.22.1"
tauri-plugin-fs = "2.4.4"
image = "0.25.9"
tauri-plugin-dialog = "2"
log = "0.4.29"
tauri-plugin-log = "2"
dirs = "6.0.0"
chrono = "0.4.44"
# Already pulled in transitively by tauri's async runtime; named directly here
# only for the `sync`/`time` primitives export.rs needs (oneshot channel,
# timeout) — no new runtime is introduced.
tokio = { version = "1", features = ["sync", "time"] }

# ── Host print-to-PDF backends (`--export-pdf`, IMPL-LTTCE-XPT-00005) ─────────
# Per DRY-and-Variants.md, the variant is selected *here*, in the manifest —
# never with #[cfg(target_os)] in source. Each of these crates is already in
# the dependency graph via wry/tauri (see Cargo.lock); they are named directly
# only so `platform/impls/<os>.rs` can call the host print API. Versions are
# pinned to what wry 0.57 / tauri 2.12 already resolve to, so no second copy of
# any of them is introduced. Re-check after every dependency update: a stale
# Windows pin does not merely duplicate a crate, it breaks the build — tauri
# hands platform_impl the NEWER ICoreWebView2 types, and the older crate's
# Interface/Result cannot handle them (E0277/E0599, 2026-09-27).
#
# macOS prints through AppKit (NSPrintInfo / NSPrintOperation), like wry's own
# print(), so objc2-app-kit is named with exactly the features used — all
# already enabled in the graph by wry. It replaced block2 and objc2-web-kit's
# "WKPDFConfiguration" feature, which served the snapshot API used before
# (2026-09-27); `cargo update -p lattice` then locked 0 new packages.

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[dev-dependencies]
# Pure-Rust PDF rasterizer for examples/export_demo.rs only: it renders each
# exported PDF to measure the printed margins (REQ-LTTCE-XPT-00012). Never in
# the shipped binary. No default features: the hosts embed every font they
# use, so the standard-font and CJK-cmap tables would only add weight
# (measured identical on all 18 CI PDFs of run 37221149163).
hayro = { version = "0.8.0", default-features = false }
tempfile = "3.24.0"
tauri = { version = "2", features = ["test"] }
url = "2"

# examples/app_screenshot.rs only (CI screenshot of the main window, one per
# desktop leg). No new crates: each is already in the tree on its target —
# `windows` is a dependency above, core-graphics/core-foundation come with tao
# on macOS, x11-dl with tao on Linux. Cargo's resolver (v2+; edition 2024
# defaults to v3) enables dev-dependency features only for tests and examples,
# never for the release build, so the shipped binary is unchanged — checked by
# comparing `cargo tree -e normal,features` per target before and after.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps", # PrintWindow
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11-dl = "2.21"

[[test]]
name = "file_open_tests"
path = "tests/file_open_tests.rs"

[[example]]
name = "e2e_harness"
path = "examples/e2e_harness.rs"

[[example]]
name = "e2e_android"
path = "examples/e2e_android.rs"

[[example]]
name = "e2e_ios"
path = "examples/e2e_ios.rs"

[profile.dev]
opt-level = 0
debug = true
