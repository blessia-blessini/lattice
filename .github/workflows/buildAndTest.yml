name: Build and Test Matrix

permissions:
  contents: read

on:

  push:
    branches: [ "*build*" ] # look for build in branch name
    tags: [ "v*.*.*" ]      # release tag triggers full build + publish

  workflow_dispatch:  # <--- This enables the manual trigger
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - desktops                # macOS (Apple + Intel silicon), Linux (x64+ARM), Windows (x64+ARM)
        - non-apple-os-desktops   # Windows (x64+ARM), Linux (x64+ARM)
        - windows-desktop
        - windows-arm-desktop
        - linux-desktop
        - linux-arm-desktop
        - macos-universal
        - macos-arm64
        - macos-intel
        - android
        - ios

  # Do not build on pull requests
  # pull_request:
  #  branches: [ "main", "dev*" ]

concurrency:
  # Make it wait between branches - it is not needed but it is more human to give chance to
  #   Cancel builds if needed manually and avoid action minutes burning out
  #   ADD -${{ github.ref }} to make it NOT wait between branches
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ################################################################
  # JOB 1: SETUP (Define & Filter Matrix)
  ################################################################
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      # REQ-LTTCE-FOS-00009: release (tag vX.Y.Z) | candidate (vX.Y.Z-suffix:
      # built and checked like a release, never published) | build. Every
      # later job follows it.
      kind: ${{ steps.release-plan.outputs.kind }}
    steps:
    - name: Checkout (release plan)
      uses: actions/checkout@v6
      with:
        sparse-checkout: scripts/foss

    - name: Install Node (release plan)
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Release plan
      id: release-plan
      shell: bash
      env:
        BUILD_REF: ${{ github.ref }}
      run: node scripts/foss/foss.mjs release-plan --ref "$BUILD_REF"

    - name: Strings and Matrix Definition
      id: set-matrix
      shell: bash
      run: |
        # 1. Define the Master Matrix as a JSON String
        #    (We use a compact JSON structure here)
        CONST_JSON='[
          {
            "os": "windows-latest",
            "platform": "windows-desktop",
            "export_mode": "required",
            "bldprefix": "",
            "mobile_build": "",
            "args": "",
            "download_name": "Windows-AMD64(and INTEL)-Desktop-App",
            "upload_path1": "src-tauri/target/release/bundle/nsis/*.exe",
            "upload_path2": ""
          },
          {
            "os": "windows-11-arm",
            "platform": "windows-arm-desktop",
            "export_mode": "required",
            "bldprefix": "",
            "mobile_build": "",
            "args": "",
            "download_name": "Windows-ARM64(and AppleSilicon)-Desktop-App",
            "upload_path1": "src-tauri/target/release/bundle/nsis/*.exe",
            "upload_path2": ""
          },
          {
            "os": "macos-latest",
            "platform": "macos-arm64",
            "export_mode": "required",
            "bldprefix": "",
            "mobile_build": "",
            "args": "--target aarch64-apple-darwin",
            "download_name": "MacOS-ARM64-AppleSilicon-Desktop-App",
            "upload_path1": "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg",
            "upload_path2": ""
          },
          {
            "os": "macos-latest",
            "platform": "macos-intel",
            "export_mode": "optional",
            "bldprefix": "",
            "mobile_build": "",
            "args": "--target x86_64-apple-darwin",
            "download_name": "MacOS-Intel-x86_64-Desktop-App",
            "upload_path1": "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg",
            "upload_path2": ""
          },
          {
            "os": "ubuntu-latest",
            "platform": "linux-desktop",
            "export_mode": "required",
            "bldprefix": "",
            "mobile_build": "",
            "args": "--config src-tauri/target/appimage-licences/tauri.conf.json",
            "download_name": "Linux-Desktop-App-tested-on-Ubuntu-Appimage",
            "upload_path1": "src-tauri/target/release/bundle/appimage/*.AppImage",
            "upload_path2": "src-tauri/target/release/bundle/deb/*.deb"
          },
          {
            "os": "ubuntu-24.04-arm",
            "platform": "linux-arm-desktop",
            "export_mode": "required",
            "bldprefix": "",
            "mobile_build": "",
            "args": "--config src-tauri/target/appimage-licences/tauri.conf.json",
            "download_name": "Linux-ARM64-Desktop-App-tested-on-Ubuntu-Appimage",
            "upload_path1": "src-tauri/target/release/bundle/appimage/*.AppImage",
            "upload_path2": "src-tauri/target/release/bundle/deb/*.deb"
          },
          {
            "os": "ubuntu-latest",
            "platform": "android",
            "export_mode": "skip",
            "bldprefix": "android",
            "mobile_build": "-Ax",
            "args": "",
            "download_name": "Android-App-APK-and-aab",
            "upload_path1": "src-tauri/gen/android/app/build/outputs/**/*.apk",
            "upload_path2": "src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab"
          },
          {
            "os": "macos-latest",
            "platform": "ios",
            "export_mode": "skip",
            "bldprefix": "ios",
            "mobile_build": "-Ax",
            "args": "ios",
            "download_name": "iOS-App-Archive",
            "upload_path1": "src-tauri/gen/apple/build/Release-iphoneos/*.ipa",
            "upload_path2": ""
          }
        ]'

        # 2. Determine Logic from Inputs or Branch Name
        TARGET="${{ inputs.platform }}"
        BRANCH="${{ github.ref_name }}"

        # If triggered by push (not manual), derive target from branch name or tag
        if [ "${{ github.event_name }}" == "push" ]; then
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET="all"   # tag vX.X.X → build every platform
          elif [[ "$BRANCH" == *"buildAll"* ]]; then
            TARGET="all"
          elif [[ "$BRANCH" == *"buildDesktops"* ]]; then
            TARGET="desktops"
          elif [[ "$BRANCH" == *"buildAndroid"* ]]; then
            TARGET="android"
          elif [[ "$BRANCH" == *"buildIos"* ]]; then
            TARGET="ios"
          elif [[ "$BRANCH" == *"buildWindows"* ]]; then
            TARGET="windows-desktop"
          elif [[ "$BRANCH" == *"buildLinuxArm"* ]]; then   # before buildLinux: substring match
            TARGET="linux-arm-desktop"
          elif [[ "$BRANCH" == *"buildLinux"* ]]; then
            TARGET="linux-desktop"
          elif [[ "$BRANCH" == *"buildMacosArm"* ]]; then
            TARGET="macos-arm64"
          elif [[ "$BRANCH" == *"buildMacosIntel"* ]]; then
            TARGET="macos-intel"
          elif [[ "$BRANCH" == *"buildMacos"* ]]; then
            TARGET="desktops-macos"  # both macOS arches
          else
            echo "Branch name setup requires explicit target. Stopping."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        echo "Selected Target Logic: $TARGET"

        # 3. Filter JSON using jq
        #    We construct a jq select query based on the TARGET
        if [ "$TARGET" == "all" ]; then
          FINAL_JSON=$(echo "$CONST_JSON")
        elif [ "$TARGET" == "desktops" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "windows-desktop" or .platform == "windows-arm-desktop" or .platform == "linux-desktop" or .platform == "linux-arm-desktop" or .platform == "macos-arm64" or .platform == "macos-intel")]')
        elif [ "$TARGET" == "desktops-macos" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "macos-arm64" or .platform == "macos-intel")]')
        elif [ "$TARGET" == "non-apple-os-desktops" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "windows-desktop" or .platform == "windows-arm-desktop" or .platform == "linux-desktop" or .platform == "linux-arm-desktop")]')
        elif [ "$TARGET" == "windows-desktop" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "windows-desktop")]')
        elif [ "$TARGET" == "windows-arm-desktop" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "windows-arm-desktop")]')
        elif [ "$TARGET" == "linux-desktop" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "linux-desktop")]')
        elif [ "$TARGET" == "macos-arm64" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "macos-arm64")]')
        elif [ "$TARGET" == "macos-intel" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "macos-intel")]')
        elif [ "$TARGET" == "android" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "android")]')
        elif [ "$TARGET" == "ios" ]; then
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c '[.[] | select(.platform == "ios")]')
        else
          # Fallback or specific platform name match
          FINAL_JSON=$(echo "$CONST_JSON" | jq -c --arg t "$TARGET" '[.[] | select(.platform == $t)]')
        fi

        # 4. Output
        # Compact it one last time to be safe for GITHUB_OUTPUT
        FINAL_JSON=$(echo "$FINAL_JSON" | jq -c '.')
        echo "Generated Matrix: $FINAL_JSON"
        echo "matrix=$FINAL_JSON" >> "$GITHUB_OUTPUT"

  ################################################################
  # JOBS 1b-1d: FOSS COMPLIANCE (REQ-LTTCE-FOS-00002 / 00004 / 00007 /
  #   00008 / 00009). foss-compliance.yml also runs on every pull
  #   request to dev and every push to dev; here it writes the SBOMs
  #   (sbom: true, which only a build passes).
  #
  #   build (branch, manual):  foss-compliance beside the build legs,
  #                            which ship the committed notices.
  #   release / candidate tag: foss-scan -> foss-compliance-release ->
  #                            build legs. The deep scan (Legattice:
  #                            ORT + ScanCode + the ledger) stops the
  #                            run while ANY topic is undecided -- decide
  #                            it in the Legattice ledger, then "Re-run
  #                            failed jobs" here. Its notice additions
  #                            replace the committed ones, the notices
  #                            are regenerated and every leg ships those.
  #
  #   The FOSS job appears twice because a job's needs are fixed: on a
  #   tag the build legs wait for it, on a branch they must not. Only
  #   one of the two runs.
  ################################################################
  foss-compliance:
    needs: setup
    if: needs.setup.outputs.kind == 'build'
    uses: ./.github/workflows/foss-compliance.yml
    with:
      sbom: true

  foss-scan:
    needs: setup
    if: needs.setup.outputs.kind != 'build'
    # @main on purpose, an accepted risk (same owner): ARCH-LTTCE-FOS-00009.
    uses: blessia-blessini/legattice/.github/workflows/scan.yml@main
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      # Nothing else runs yet: the build legs wait for this.
      shards: '16'
      block_at: low

  foss-compliance-release:
    needs: [setup, foss-scan]
    if: needs.setup.outputs.kind != 'build'
    uses: ./.github/workflows/foss-compliance.yml
    with:
      sbom: true
      fresh_additions: ${{ needs.foss-scan.outputs.results_artifact }}

  ################################################################
  # JOB 2: BUILD AND TEST
  #   On a release or candidate tag the legs wait for
  #   foss-compliance-release and ship its regenerated notices
  #   (step 102); on a branch they start at once, as before.
  ################################################################
  build-and-test:
    needs: [setup, foss-compliance-release]
    if: >-
      !cancelled() && needs.setup.result == 'success'
      && needs.setup.outputs.matrix != '[]' && needs.setup.outputs.matrix != ''
      && (needs.setup.outputs.kind == 'build' || needs.foss-compliance-release.result == 'success')
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      BUILD_TYPE: RelWithDebInfo
      # Common env vars can go here

    steps:
    ################################################################
    # 050 / Set reusable strings
    ################################################################
    - name: 050. Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-platform=${{ matrix.config.platform }}" >> "$GITHUB_OUTPUT"
        echo "build-args=${{ matrix.config.args }}" >> "$GITHUB_OUTPUT"
        echo "download_path1=${{ matrix.config.upload_path1 }}" >> "$GITHUB_OUTPUT"
        echo "download_path2=${{ matrix.config.upload_path2 }}" >> "$GITHUB_OUTPUT"

    ################################################################
    # 100 / Checkout -- WITHOUT the FOSS compliance tooling
    #       (scripts/foss/ and its data in foss/). The product must
    #       build and pass its tests without them: they generate
    #       THIRD-PARTY-NOTICES.md and gate licences, but no line of
    #       them may reach an installer. A sparse checkout also
    #       leaves their blobs unfetched. Step 389 adds the one
    #       script step 390 needs, after build and tests.
    ################################################################
    - name: 100. Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          /*
          !/scripts/foss/
          !/foss/
        sparse-checkout-cone-mode: false

    ################################################################
    # 101 / FOSS tooling really is absent -- otherwise a sparse
    #       checkout that silently matched nothing would leave the
    #       independence of step 100 unproven.
    ################################################################
    - name: 101. FOSS tooling absent from the product build
      shell: bash
      run: |
        for d in scripts/foss foss; do
          if [ -e "$d" ]; then
            echo "::error::$d is checked out; the product build must not see the FOSS tooling (step 100)"
            exit 1
          fi
        done
        for f in LICENSE THIRD-PARTY-NOTICES.md; do
          [ -f "$f" ] || { echo "::error::$f missing; it is a bundled product resource"; exit 1; }
        done
        echo "scripts/foss and foss absent; LICENSE and THIRD-PARTY-NOTICES.md present"

    ################################################################
    # 102 / Release and candidate tags (REQ-LTTCE-FOS-00009):
    #       the notices regenerated from this commit's deep scan
    #       (foss-compliance-release) replace the committed ones before
    #       anything is built -- THIRD-PARTY-NOTICES.md is bundled, the
    #       export notices are compiled into the frontend. Step 390
    #       then checks the installers against these files.
    ################################################################
    - name: 102. Use the release notices of the deep scan
      if: needs.setup.outputs.kind != 'build'
      uses: actions/download-artifact@v8
      with:
        name: release-notices
        path: .

    ################################################################
    # 120 - 125 Cache Dependencies
    ################################################################

    # RUST Cache ###################################################
    - name: 120. Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    # end RUST Cache ###############################################

    # NPM Cache ####################################################
    - name: 121.1 Get npm cache directory
      id: npm-cache-dir
      shell: bash # Use bash to ensure consistent syntax across OS
      run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
    # now use it to cache npm dependencies
    - name: 121.2 Cache NPM Dependencies
      uses: actions/cache@v5
      with:  ## ~/.npm
        path: |
          ${{ steps.npm-cache-dir.outputs.dir }}
        key: npm-${{ matrix.config.os }}${{ matrix.config.mobile_build}}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ matrix.config.os }}${{ matrix.config.mobile_build}}-
    # end NPM Cache ################################################
    # END 120 - 125 Cache Dependencies #############################


    - name: 123. Install Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'


    ################################################################
    # 150 / Configure Environment (Script)
    #       Android init is skipped on EVERY leg here: only the android
    #       leg has an Android SDK, and it inits in step 251 after
    #       installing one in step 250. Other runners may lack the SDK
    #       (ubuntu-24.04-arm, windows-11-arm) and would fail the init.
    ################################################################
    - name: 150. Configure Environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # rem chmod +x .\setup_env.ps1
        .\scripts\setup_env.ps1 -SkipAndroidInit

    - name: 151. Configure Environment (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        chmod +x ./scripts/setup_env.sh
        ./scripts/setup_env.sh --skip-android-init

    - name: 152. calculate build number
      shell: bash
      working-directory: ${{ github.workspace }}
      id: build-no-gen
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          BUILD_NO=$(./buildno-gen.exe)
        else
          BUILD_NO=$(./buildno-gen)
        fi
        echo "BUILD_NO=$BUILD_NO" >> $GITHUB_OUTPUT

    # Cross compilation
    # windows-arm-desktop is NOT cross-compiled: it runs natively on the
    # windows-11-arm runner, whose default host target is already
    # aarch64-pc-windows-msvc, so no extra rustup target is needed.
    - name: 154. Setup Rust Targets (macOS ARM64)
      if: matrix.config.platform == 'macos-arm64'
      run: rustup target add aarch64-apple-darwin
    - name: 155. Setup Rust Targets (macOS Intel)
      if: matrix.config.platform == 'macos-intel'
      run: rustup target add x86_64-apple-darwin

    - name: 190. Install create-dmg (macOS)
      # Required by Tauri's bundle_dmg.sh to create DMG installers.
      # Not pre-installed on GitHub Actions macOS runners.
      if: runner.os == 'macOS'
      run: brew install create-dmg

    ################################################################
    # 200 / Setup JDK 17 (Android)
    ################################################################
    - name: 200. Setup Java 17 for Android
      if: matrix.config.platform == 'android'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    ################################################################
    # 250 / Setup Android: SDK and Project
    ################################################################
    # `packages` MUST be set explicitly. The action's own default is
    # 'tools platform-tools', and the legacy 'tools' package no longer exists in
    # Google's SDK repository (superseded by cmdline-tools). sdkmanager then warns
    # "Failed to find package 'tools'" and exits 1, failing this step — which is
    # what broke the v0.3.25 tag build. Requesting only platform-tools avoids the
    # dead package; cmdline-tools itself is installed by the action.
    - name: 250. Setup Android SDK
      if: matrix.config.platform == 'android'
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: 251. Initialize Android Project
      if: matrix.config.platform == 'android'
      run: npm run tauri android init

    ################################################################
    # 350 / Build App
    ################################################################
    # REQ-LTTCE-FOS-00006: the AppImage bundles this runner's gdk-pixbuf loaders
    # and their libraries, and its typelibs; the TIFF loader would bring
    # GPL-2.0+ libjbig along, and nothing in Lattice loads a typelib.
    - name: 340. Keep the TIFF loader and typelibs out of the AppImage (Linux)
      if: matrix.config.platform == 'linux-desktop' || matrix.config.platform == 'linux-arm-desktop'
      shell: bash
      run: bash scripts/appimage-exclude.sh

    # REQ-LTTCE-FOS-00006: linuxdeploy-plugin-gtk copies GIO modules and image
    # loaders without their packages' copyright files, and most copyright files
    # point to /usr/share/common-licenses; this stages both and writes the Tauri
    # config the Linux legs pass to 350 (matrix args: --config).
    - name: 341. Stage licence files for the AppImage (Linux)
      if: matrix.config.platform == 'linux-desktop' || matrix.config.platform == 'linux-arm-desktop'
      shell: bash
      run: bash scripts/appimage-stage-licences.sh

    - name: 350. Build App (Desktop AND Mobile)
      if: matrix.config.platform != 'ios' ### && matrix.config.platform != 'android' # see comment in 350.2
      env:
        # On a tag build, prefix with the tag so the window title shows e.g. "lattice (v0.2.20 · windows-desktop-abc123)"
        LATTICEBUILD_NO: ${{ startsWith(github.ref, 'refs/tags/') && format('{0} · {1}-{2}', github.ref_name, matrix.config.platform, steps.build-no-gen.outputs.BUILD_NO) || format('{0}-{1}', matrix.config.platform, steps.build-no-gen.outputs.BUILD_NO) }}
      run: npm run tauri ${{ matrix.config.bldprefix }} build -- ${{ matrix.config.args }}

    ################################################################
    # 355 / Package MSIX (Windows desktop, for the Microsoft Store)
    ################################################################
    - name: 355. Package MSIX (Windows)
      if: matrix.config.platform == 'windows-desktop' || matrix.config.platform == 'windows-arm-desktop'
      shell: pwsh
      run: |
        $arch = "${{ matrix.config.platform == 'windows-arm-desktop' && 'arm64' || 'x64' }}"
        .\scripts\build-msix.ps1 -Arch $arch

    - name: 356. Upload MSIX Artifact (Windows)
      if: matrix.config.platform == 'windows-desktop' || matrix.config.platform == 'windows-arm-desktop'
      uses: actions/upload-artifact@v7
      id: a-msix
      with:
        # Distinct per platform (BUILD_NO alone isn't guaranteed unique
        # across parallel matrix legs); the bundle job downloads both by
        # the shared "MSIX-UNSIGNED-" prefix with merge-multiple.
        name: MSIX-UNSIGNED-${{ matrix.config.platform }}-${{ steps.build-no-gen.outputs.BUILD_NO }}
        path: dist-msix-*.msix
        if-no-files-found: warn

    - name: 350.2 Build App (iOS)
      if: matrix.config.platform == 'ios'
      env:
        LATTICEBUILD_NO: ${{ startsWith(github.ref, 'refs/tags/') && format('{0} · {1}-{2}', github.ref_name, matrix.config.platform, steps.build-no-gen.outputs.BUILD_NO) || format('{0}-{1}', matrix.config.platform, steps.build-no-gen.outputs.BUILD_NO) }}
      # iOS build requires code signing identities usually.
      # This step serves as the requested placeholder/cross-build attempt.
      run: |
        echo "Starting iOS Build..."
        # npm run tauri ios build
        echo "iOS build requires provisioning profiles. Skipping actual build command for CI demo."
        echo "  ideally, it should be done like in the step above (even _in_ the step above (not just _like_ in step above))"

    - name: 370.2 Run Frontend AND Backend Tests (React/Tauri)
      # TODO: Consider uncommenting for now we are saving some action minutes by not running tests on mobile
      # windows-arm-desktop now runs natively on windows-11-arm, so its tests
      # actually execute (a cross-compiled binary could never run here to be tested).
      if: matrix.config.platform != 'ios' # && matrix.config.platform != 'android' # see comment in 350.2
      shell: bash
      env:
        LATTICEBUILD_NO: TSTFrontEnd-${{matrix.config.platform}}-${{ steps.build-no-gen.outputs.BUILD_NO }}
        RUSTFLAGS: "--cfg integration_test"
        RUST_BACKTRACE: 1
        # --- CLI export check (build-test step 1d) ------------------------
        # Runs on every DESKTOP leg and publishes that leg's own demo.html /
        # demo.pdf, so the release page can show what each platform's own
        # WebView produces rather than one platform's output standing in for
        # all of them.
        #
        # Per-leg strictness comes from the matrix field `export_mode`:
        #
        #   required — the leg MUST produce both documents; a failure is a
        #              real finding about that platform's export path.
        #   optional — best effort: publish if it works, never fail the build.
        #   skip     — no desktop binary exists on this leg at all.
        #
        # `macos-intel` is deliberately `optional`: it cross-builds
        # x86_64-apple-darwin on an arm64 `macos-latest` runner, so *executing*
        # the result needs Rosetta 2, which the arm64 runner image does not
        # guarantee. A binary that cannot start on the host is not a defect in
        # print_to_pdf, and must not be reported as one. Every other desktop
        # leg runs a binary built for its own architecture.
        LATTICE_EXPORT_OUT: ${{ github.workspace }}/demo-export
        LATTICE_EXPORT_LABEL: ${{ matrix.config.platform }}
        LATTICE_EXPORT_REQUIRED: ${{ matrix.config.export_mode == 'required' && '1' || '0' }}
        # No LATTICE_EXPORT_BIN. The check locates the build itself, including
        # the cross-build's target/<triple>/release/ tree. On macOS it mounts
        # the .dmg and runs the .app inside it — the artefact a user actually
        # downloads, and the only one that survives the build: the dmg bundler
        # deletes bundle/macos/*.app once the DMG is written ("Cleaning
        # .../lattice.app" in the step-350 log), which is what made this check
        # fail with "no lattice binary found" on 2026-09-26.
      # Frontend tests use jsdom, so they can theoretically run anywhere node is.
      # But usually we run them on standard desktop runners.
      # Note: 'npm install/ci' was done in step 150/151.
      run: |
        ./scripts/build-test.sh

    ################################################################
    # 375 / Upload this leg's Lattice-generated demo documents
    #       Produced by the CLI export check inside step 370.2
    #       (build-test step 1d -> examples/export_demo.rs --out).
    #
    #       One artifact per DESKTOP leg, each holding demo-<platform>.html,
    #       demo-<platform>.pdf (A4) and demo-<platform>.a3.pdf /
    #       demo-<platform>.letter.pdf, plus screenshot-<platform>.png — the
    #       running app's main window (build-test step 1e, best effort: a leg
    #       may lack it, with a warning annotation). Step 905 downloads them all by the
    #       shared "DEMO-EXPORT-" prefix and publishes every one, so the
    #       release page shows each platform's own rendering side by side
    #       (A4 embedded, the other papers linked).
    #
    #       if-no-files-found follows the leg's `export_mode`: `error` on a
    #       required leg, so an empty directory fails where the cause is
    #       visible instead of silently dropping a platform from the release
    #       page; `warn` on an optional leg, which is allowed to produce
    #       nothing (see the Rosetta note on macos-intel in step 370.2).
    ################################################################
    - name: 375. Upload Lattice-generated demo documents
      if: matrix.config.export_mode != 'skip'
      uses: actions/upload-artifact@v7
      id: a-demo-export
      with:
        name: DEMO-EXPORT-${{ matrix.config.platform }}
        path: demo-export/
        if-no-files-found: ${{ matrix.config.export_mode == 'required' && 'error' || 'warn' }}

    ################################################################
    # 380 / Generate Documentation (Linux Only)
    ################################################################
    - name: 380. CURRENLY ONLY LINUX - Generate Documentation
      # This runs on all platforms (and generates the same content for docs)
      #    but we only upload docs generated from linux (most cost effective on GitHub Actions)
      if: matrix.config.platform == 'linux-desktop'
      shell: bash
      run: |
        # 1. Generate Build Number with Prefix
        # Utility is already built and placed in root by step 151 (setup_env.sh)
        chmod +x ./buildno-gen
        export LATTICEBUILD_NO="CI_Doc_$(./buildno-gen)"
        # PowerShell equivalent for local Windows users:
        # $env:LATTICEBUILD_NO="CI_Doc_$(.\buildno-gen.exe)"
        echo "Generated Build Number for Docs: $LATTICEBUILD_NO"

        # 2. Frontend Docs (Markdown) -> docs/gen/frontend
        npm run doc

        # 3. Backend Docs (HTML) -> docs/gen/backend
        # Note: Cargo doc output is in target/doc, we need to move it.
        # Ensure parent dir exists
        mkdir -p docs/gen

        # Run cargo doc
        cd src-tauri
        cargo doc --no-deps
        cd ..

        # Move output
        mv src-tauri/target/doc docs/gen/backend


    ################################################################
    # 410 / Upload Documentation
    ################################################################
    - name: 410. CURRENLY ONLY LINUX - Upload Documentation
      if: matrix.config.platform == 'linux-desktop'
      uses: actions/upload-artifact@v7
      id: a-docs-gen
      with:
        name: DOCS
        path: |
          docs/

    ################################################################
    # 415 / Upload Coverage HTML report (Linux only)
    ################################################################
    - name: 415. CURRENLY ONLY LINUX - Upload Coverage Report
      if: matrix.config.platform == 'linux-desktop'
      uses: actions/upload-artifact@v7
      id: TestsRun
      with:
        name: COVERAGE
        path: |
          src-tauri/target/llvm-cov/html/
          coverage/

    ################################################################
    # 390 / FOSS: the installers users download carry LICENSE and
    #       THIRD-PARTY-NOTICES.md (REQ-LTTCE-FOS-00001, STST).
    #       Unpacks each package (NSIS: silent install into a temp
    #       folder) -- after the tests, so an installed copy can never
    #       meet the E2E harness. Android/iOS: deferred (FU-6).
    #       Step 389 first brings scripts/foss/ into the sparse
    #       checkout of step 100 -- same commit, build already done.
    ################################################################
    - name: 389. FOSS - fetch the installer check tooling
      if: matrix.config.platform != 'ios' && matrix.config.platform != 'android'
      shell: bash
      env:
        # Git Bash on Windows would rewrite '/scripts/foss/' into C:/Program Files/Git/...
        MSYS_NO_PATHCONV: "1"
      # /foss/ too: step 391 checks the AppImage against foss/appimage-packages.json.
      run: git sparse-checkout add '/scripts/foss/' '/foss/'

    - name: 390. FOSS - licence files inside the installers
      if: matrix.config.platform != 'ios' && matrix.config.platform != 'android'
      shell: bash
      run: bash scripts/foss/assert-bundled.sh ${{ matrix.config.upload_path1 }} ${{ matrix.config.upload_path2 }} dist-msix-*.msix

    # REQ-LTTCE-FOS-00006: every library in the AppImage must come from a package
    # reviewed in foss/appimage-packages.json, with an unchanged copyright file and
    # a licence the policy admits for shared libraries. Runs on the machine that
    # built it, so dpkg knows the exact packages; writes the AppImage SBOM.
    - name: 391. FOSS - AppImage system libraries (Linux)
      if: matrix.config.platform == 'linux-desktop' || matrix.config.platform == 'linux-arm-desktop'
      shell: bash
      env:
        APPIMAGE_TARGET: ${{ matrix.config.platform == 'linux-desktop' && 'linux-x64' || 'linux-arm64' }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        images=( ${{ matrix.config.upload_path1 }} )
        if [ "${#images[@]}" -ne 1 ]; then echo "expected one AppImage, found ${#images[@]}" >&2; exit 1; fi
        work="$(mktemp -d)"
        chmod +x "${images[0]}"
        (cd "$work" && "$GITHUB_WORKSPACE/${images[0]}" --appimage-extract >/dev/null)
        node scripts/foss/foss.mjs appimage --appimage "${images[0]}" --root "$work/squashfs-root" --target "$APPIMAGE_TARGET" --out-dir foss-appimage

    - name: 392. Upload AppImage SBOM (Linux)
      if: always() && (matrix.config.platform == 'linux-desktop' || matrix.config.platform == 'linux-arm-desktop')
      uses: actions/upload-artifact@v7
      with:
        name: FOSS-APPIMAGE-${{ matrix.config.platform }}
        path: foss-appimage/
        if-no-files-found: warn

    ################################################################
    # 400 / Upload Artifacts
    ################################################################
    - name: 400. Upload Artifacts (ALL)
      uses: actions/upload-artifact@v7
      id: a-download-exec
      with:
        name: DOWNLOAD-${{matrix.config.download_name}}-${{ steps.build-no-gen.outputs.BUILD_NO }}
        path: |
          ${{ steps.strings.outputs.download_path1 }}
          ${{ steps.strings.outputs.download_path2 }}


    - name: 800. SUMMARY PAGE UPDATE
      working-directory: ${{ github.workspace }}
      shell: bash
      continue-on-error: true
      run: |
        echo "### ${{ matrix.config.download_name }} BUILD" >> $GITHUB_STEP_SUMMARY
        echo " - Download built executable file(s) from: ${{ steps.a-download-exec.outputs.artifact-url }}"  >>  $GITHUB_STEP_SUMMARY
        echo " - Additional downloads"                                    >>  $GITHUB_STEP_SUMMARY
        echo "     - link DOCs    : ${{ steps.a-docs-gen.outputs.artifact-url }}" >>  $GITHUB_STEP_SUMMARY
        echo "     - link Coverage: ${{ steps.TestsRun.outputs.artifact-url }}"   >>  $GITHUB_STEP_SUMMARY
        echo "     - if a link above is empty then this artefact **is intentionally __not__** generated for ${{ matrix.config.platform }}" >>  $GITHUB_STEP_SUMMARY


      # - `\u26A0` is the warning emoji  ⚠️.
      # - `\u2705` is the check mark emoji ✅.
      # - `\u274C` is the cross mark emoji `❌`.
      # - 🟢 is a green circle.
      # - 🟡 is a yellow circle.
      # - 🔴 is a red circle.

  ################################################################################################################################
  ################################################################################################################################
  # JOB 3: PACKAGE MSIX BUNDLE (tag vX.X.X builds only, for Store submission)
  ################################################################################################################################
  package-msix-bundle:
    needs: [setup, build-and-test]
    # Release and candidate (REQ-LTTCE-FOS-00009): a candidate rehearses the
    # whole build, MSIX bundle included; only publishing is left out.
    if: needs.setup.outputs.kind == 'release' || needs.setup.outputs.kind == 'candidate'
    runs-on: windows-latest
    steps:
    - name: 100. Checkout
      uses: actions/checkout@v6

    ################################################################
    # 357.1 / Download every per-architecture MSIX built above
    ################################################################
    - name: 357.1. Download MSIX Artifacts
      uses: actions/download-artifact@v6
      with:
        pattern: MSIX-UNSIGNED-*
        path: .
        merge-multiple: true

    ################################################################
    # 357.2 / Combine into one .msixbundle (whatever architectures
    #         are present -- see build-msix-bundle.ps1 for the
    #         single-architecture fallback while windows-arm-desktop
    #         is on hold in the setup job's matrix filter).
    ################################################################
    - name: 357.2. Build MSIX Bundle
      shell: pwsh
      run: .\scripts\build-msix-bundle.ps1

    - name: 357.3. Upload MSIX Bundle Artifact
      uses: actions/upload-artifact@v7
      id: a-msix-bundle
      with:
        # "DOWNLOAD-" prefix: publish-release-site's step 901 downloads every
        # DOWNLOAD-* artifact and step 903 collects it into staging/, so this
        # bundle rides the same path onto the GitHub Release as the installers.
        name: DOWNLOAD-msix-bundle-${{ github.ref_name }}
        path: lattice-md.msixbundle
        if-no-files-found: warn

    ################################################################
    # 357.4 / Summary link -- manual fallback if/when auto-submission
    #         to Partner Center exists and fails: download this
    #         artifact and drag it onto the Store product's Packages
    #         page by hand, same as today's manual submission flow.
    ################################################################
    - name: 357.4. Summary Page Update
      shell: bash
      run: |
        echo "### MSIX BUNDLE (Microsoft Store submission)" >> $GITHUB_STEP_SUMMARY
        echo " - Download: ${{ steps.a-msix-bundle.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
        echo " - Manual fallback: if Store submission is ever automated and it fails, download this bundle and upload it by hand on the Packages page of the lattice-md product in Partner Center." >> $GITHUB_STEP_SUMMARY

  ################################################################################################################################
  ################################################################################################################################
  # JOB 4: PUBLISH TO RELEASE SITE  (tag vX.X.X builds only)
  ################################################################################################################################
  publish-release-site:
    needs: [setup, build-and-test, package-msix-bundle, foss-scan, foss-compliance-release]
    # Only an exact release tag vX.Y.Z publishes (REQ-LTTCE-FOS-00009), and only
    # when the deep scan found no undecided topic and the installers carry the
    # notices made from its decisions (foss-compliance-release).
    if: >-
      !cancelled() && needs.setup.outputs.kind == 'release'
      && needs.build-and-test.result == 'success' && needs.package-msix-bundle.result == 'success'
      && needs.foss-scan.result == 'success' && needs.foss-compliance-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # required to create GitHub Releases
      id-token: write      # required for attestation (OIDC token)
      attestations: write  # required to write the attestation

    env:
      # Linked from EVERY release: the GitHub Release body (904) and the
      # release-site page (905).  Points at the default branch so users always
      # land on the CURRENT statement; swap `dev` for "${VERSION}" if a
      # per-release snapshot is ever wanted instead.
      PRIVACY_URL: https://github.com/${{ github.repository }}/blob/dev/PRIVACY.md

    steps:
    ################################################################
    # 900 / Extract version from tag
    ################################################################
    - name: 900. Extract version
      id: version
      shell: bash
      run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

    ################################################################
    # 900.5 / Extract release notes from CHANGELOG.md
    #         Checks out the source repo (sparse, CHANGELOG.md only)
    #         and pulls out the ## vX.X.X section matching this tag.
    #         The extracted Markdown is saved to release-notes.md
    #         for use by step 904.
    #
    #         Edit CHANGELOG.md before pushing the tag — that file
    #         is the single place to write & review the release notes.
    ################################################################
    - name: 900.5a. Sparse-checkout CHANGELOG.md
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          CHANGELOG.md
          public
          docs/demo
        sparse-checkout-cone-mode: true
        fetch-depth: 1
        path: _src

    - name: 900.5. Extract release notes from CHANGELOG.md
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"

        echo "--- All the CHANGELOG.md file ---"
        cat ./_src/CHANGELOG.md

        # Extract the block that starts with "## $VERSION" up to the next "## "
        PARAM1="/^## ${VERSION}$/,/---/"
        echo "PARAM1 is between the xx: xx${PARAM1}xx"
        echo "===================="
        echo "./_src/CHANGELOG.md"
        echo "===================="
        cat ./_src/CHANGELOG.md
        echo "===================="
        awk  "${PARAM1}" ./_src/CHANGELOG.md | head -n -1 | sed '1d' > release-notes.md

        # Fallback: if nothing was extracted, use a generic note
        if [ ! -s release-notes.md ]; then
          echo "Automated release — no changelog entry found for ${VERSION}." > release-notes.md
          echo "" >> release-notes.md
        fi

        echo "--- Release notes preview ----------"
        cat release-notes.md
        echo "--- end of Release notes preview ---"

    ################################################################
    # 901 / Download every DOWNLOAD-* artifact from this run
    ################################################################
    - name: 901. Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: DOWNLOAD-*
        path: downloaded-artifacts
        merge-multiple: false

    ################################################################
    # 901.5 / Download coverage HTML report
    ################################################################
    - name: 901.5. Download coverage report
      uses: actions/download-artifact@v8
      with:
        name: COVERAGE
        path: coverage-html

    ################################################################
    # 901.6 / Download the Lattice-generated demo documents
    #         One DEMO-EXPORT-<platform> artifact per desktop leg (step
    #         375). merge-multiple flattens them into one directory: the
    #         file names already carry the platform, so nothing collides
    #         and step 905 can simply glob what arrived.
    ################################################################
    - name: 901.6. Download Lattice-generated demo documents
      uses: actions/download-artifact@v8
      with:
        pattern: DEMO-EXPORT-*
        path: demo-export
        merge-multiple: true

    ################################################################
    # 901.7 / Download the FOSS compliance files (job foss-compliance):
    #         THIRD-PARTY-NOTICES.md + lattice-<target>.cdx.json
    ################################################################
    - name: 901.7. Download FOSS compliance files
      uses: actions/download-artifact@v8
      with:
        name: FOSS
        path: foss-out

    # The AppImage SBOMs (lattice-linux-*-appimage.cdx.json) from step 392; 903.1
    # publishes every *.cdx.json in foss-out.
    - name: 901.8. Download AppImage SBOMs
      uses: actions/download-artifact@v8
      with:
        pattern: FOSS-APPIMAGE-*
        path: foss-out
        merge-multiple: true

    ################################################################
    # 902 / Checkout lattice-docs-releases
    #       Requires secret RELEASE_SITE_TOKEN (PAT with contents:write
    #       on blessia-blessini/lattice-docs-releases)
    ################################################################
    - name: 902. Checkout lattice-docs-releases
      uses: actions/checkout@v6
      with:
        repository: blessia-blessini/lattice-docs-releases
        token: ${{ secrets.RELEASE_SITE_TOKEN }}
        path: release-site
        fetch-depth: 0

    ################################################################
    # 903 / Collect all installer files into a flat staging directory
    ################################################################
    - name: 903. Collect installers
      shell: bash
      run: |
        mkdir -p staging
        find downloaded-artifacts -type f \
          \( -name "*.exe" -o -name "*.dmg" \
             -o -name "*.AppImage" -o -name "*.deb" \
             -o -name "*.apk" -o -name "*.aab" \
             -o -name "*.ipa" -o -name "*.msixbundle" \) \
          -exec cp {} staging/ \;
        echo "--- Collected files ---"
        ls -lh staging/

    ################################################################
    # 903.1 / Add the FOSS compliance files (REQ-LTTCE-FOS-00002).
    #         In staging/ they are attested (903.5), listed in
    #         SHA256SUMS.txt (903.6) and attached to the release (904)
    #         like every installer.
    ################################################################
    - name: 903.1. Add third-party notices and SBOMs
      shell: bash
      run: |
        set -euo pipefail
        test -s foss-out/THIRD-PARTY-NOTICES.md
        cp foss-out/THIRD-PARTY-NOTICES.md foss-out/*.cdx.json staging/
        ls -lh staging/

    ################################################################
    # 903.2 / Attach what the deep scan decided (REQ-LTTCE-FOS-00009):
    #         its topics report (every topic and its decision) and the
    #         notice additions the installers' notices were made from.
    ################################################################
    - name: 903.2a. Download the deep scan's results
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.foss-scan.outputs.results_artifact }}
        path: legattice-results

    - name: 903.2b. Add the FOSS topics report
      shell: bash
      run: |
        set -euo pipefail
        cp legattice-results/topics/topics.md staging/FOSS-TOPICS.md
        cp legattice-results/topics/notice-additions.json staging/notice-additions.json
        ls -lh staging/FOSS-TOPICS.md staging/notice-additions.json

    ################################################################
    # 903.4 / Code-sign the Windows installers via SignPath Foundation
    #         (free OSS code signing — Sectigo-rooted certificate).
    #
    #   Runs ONLY when repo variable SIGNPATH_ENABLED == 'true', so the
    #   release pipeline keeps working before SignPath approval. Flip the
    #   variable on (Settings > Secrets and variables > Actions > Variables)
    #   after the project is approved and configured in the SignPath portal.
    #
    #   Prerequisites once approved (all from the SignPath portal):
    #     - Secret   SIGNPATH_API_TOKEN         (CI token; NEVER hardcode)
    #     - Variable SIGNPATH_ORGANIZATION_ID   (GUID of your org)
    #     - A project "lattice" with a signing policy + artifact config
    #       whose slugs match the values below.
    #
    #   Flow: upload the unsigned .exe files as a GitHub artifact, hand the
    #   artifact id to SignPath (it re-fetches from this run to verify
    #   provenance), then copy the signed .exe back over staging/ so the
    #   attestation in 903.5 covers the SIGNED binaries users download.
    ################################################################
    - name: 903.4a. Upload unsigned Windows installers (for SignPath)
      id: upload-unsigned-win
      if: vars.SIGNPATH_ENABLED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-windows-installers
        path: staging/*.exe
        if-no-files-found: error

    - name: 903.4b. Submit to SignPath and wait for signed artifacts
      if: vars.SIGNPATH_ENABLED == 'true'
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: lattice
        signing-policy-slug: release-signing
        artifact-configuration-slug: windows-installers
        github-artifact-id: ${{ steps.upload-unsigned-win.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: staging-signed

    - name: 903.4c. Replace unsigned installers with signed ones
      if: vars.SIGNPATH_ENABLED == 'true'
      shell: bash
      run: |
        # Guard: fail loudly if SignPath returned nothing, rather than
        # silently shipping unsigned binaries.
        if ! ls staging-signed/*.exe >/dev/null 2>&1; then
          echo "::error::SignPath produced no signed .exe in staging-signed/"
          exit 1
        fi
        cp -f staging-signed/*.exe staging/
        echo "--- Signed installers now in staging/ ---"
        ls -lh staging/*.exe

    ################################################################
    # 903.5 / Attest all release artifacts (build provenance)
    #         Links each installer to this exact workflow run + commit.
    #         Runs AFTER 903.4 so the attestation covers the signed
    #         Windows binaries (and the unsigned macOS/Linux artifacts).
    #         Verifiable by anyone with: gh attestation verify <file> --repo blessia-blessini/lattice
    ################################################################
    - name: 903.5. Attest build artifacts
      uses: actions/attest@v4
      with:
        subject-path: staging/*

    ################################################################
    # 903.6 / Generate SHA256SUMS.txt (always) and GPG-sign it (optional)
    #         One manifest covers EVERY artifact (.AppImage, .deb, .dmg,
    #         .exe). Users verify with:
    #           sha256sum -c SHA256SUMS.txt
    #         and, when the detached signature is published:
    #           gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
    #
    #   The MANIFEST needs no secrets, so it is generated unconditionally --
    #   it is the only way a cautious user can check a download today, and
    #   that matters most while the Windows installers are still unsigned.
    #   Only the DETACHED SIGNATURE needs the key, so just that part stays
    #   gated on repo variable GPG_SIGNING_ENABLED == 'true'.
    #
    #   Prerequisites for the signature (Settings > Secrets and variables):
    #     - Secret   GPG_PRIVATE_KEY      (ASCII-armored private key; NEVER hardcode)
    #     - Secret   GPG_PASSPHRASE       (passphrase for that key)
    #     - Variable GPG_SIGNING_KEY_ID   (key fingerprint or signing email)
    #   Publish the matching PUBLIC key on the download site so users can import it.
    #
    #   Computed AFTER 903.4, so checksums reflect the SIGNED .exe files.
    #   The SHA256SUMS.txt pair is added to staging/ and thus uploaded by 904.
    ################################################################
    - name: 903.6a. Generate SHA256SUMS.txt
      shell: bash
      run: |
        set -euo pipefail
        cd staging
        # Only regular files, and never the manifest or its signature
        # (the SHA256SUMS* glob covers both). `find` rather than a bare
        # glob so a stray directory cannot abort the run.
        find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' \
          | sort | xargs -r sha256sum > SHA256SUMS.txt
        echo "--- SHA256SUMS.txt ---"
        cat SHA256SUMS.txt
        # A manifest listing nothing would be worse than useless.
        if [ ! -s SHA256SUMS.txt ]; then
          echo "::error::SHA256SUMS.txt is empty -- no artifacts found in staging/"
          exit 1
        fi

    - name: 903.6b. GPG-sign SHA256SUMS.txt
      if: vars.GPG_SIGNING_ENABLED == 'true'
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        GPG_SIGNING_KEY_ID: ${{ vars.GPG_SIGNING_KEY_ID }}
      run: |
        set -euo pipefail
        # Import the signing key into an ephemeral keyring (runner is throwaway).
        echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        cd staging
        gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_SIGNING_KEY_ID" \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
        # Self-check before publishing.
        gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt

    - name: 903.6c. Warn when a release ships unsigned
      shell: bash
      env:
        SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        GPG_SIGNING_ENABLED: ${{ vars.GPG_SIGNING_ENABLED }}
      run: |
        # Deliberately OUTSIDE the SignPath/GPG gates. The guard inside 903.4c
        # only fires once signing is already switched on, so before that a
        # release could ship unsigned in complete silence. Windows SmartScreen
        # and Defender heuristics treat an unsigned, zero-reputation NSIS
        # installer as suspicious, so this must be a visible choice.
        if [ "${SIGNPATH_ENABLED:-}" != "true" ]; then
          echo "::warning::Windows installers in this release are UNSIGNED (SIGNPATH_ENABLED is not 'true'). Expect SmartScreen / Defender warnings for users."
          echo " - :warning: Windows installers are **unsigned** -- users may see SmartScreen or antivirus warnings." >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "${GPG_SIGNING_ENABLED:-}" != "true" ]; then
          echo "::warning::SHA256SUMS.txt is published but NOT GPG-signed (GPG_SIGNING_ENABLED is not 'true')."
          echo " - :warning: \`SHA256SUMS.txt\` is published but **not GPG-signed**." >> "$GITHUB_STEP_SUMMARY"
        fi

    ################################################################
    # 904 / Create GitHub Release on blessia-blessini/lattice and
    #       upload all installers as release assets.
    #       Uses GITHUB_TOKEN (automatic, no extra secret needed).
    ################################################################
    - name: 904. Create GitHub Release and upload assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"

        # The release body is the changelog extract plus a standing footer.
        # release-notes.md itself is left untouched: step 905 inlines it into
        # the release-site page, which carries its own "Notes" footer, so
        # editing it here would print the privacy line twice on that page.
        cp release-notes.md release-body.md
        {
          printf '\n---\n\n'
          printf 'Lattice collects no personal data — see the [Privacy Statement](%s).\n' "$PRIVACY_URL"
        } >> release-body.md

        echo "--- Release body preview ----------"
        cat release-body.md
        echo "--- end of Release body preview ---"

        RELEASE_URL=$(gh release create "$VERSION" staging/* \
          --repo "${{ github.repository }}" \
          --title "Lattice ${VERSION}" \
          --notes-file release-body.md \
          --latest)
        echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
        echo "Release created: $RELEASE_URL"

    ################################################################
    # 905 / Generate index.md in lattice-docs-releases linking to
    #       the GitHub Release assets (no binaries committed to repo)
    ################################################################
    - name: 905. Generate index.md and push to lattice-docs-releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN2: ${{ secrets.GH_POST_AVTRIGGER }}
        # Expressions live HERE, not in the script below: a run: block holding
        # any ${{ }} is evaluated as ONE expression, capped at 21000 characters
        # -- this script outgrew that. Plain env vars also rule out template
        # injection. GITHUB_REPOSITORY / GITHUB_REF_NAME are set by the runner.
        RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
      shell: bash
      run: |
        VERSION="${RELEASE_VERSION}"
        DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
        RELEASE_URL="${RELEASE_URL}"
        OUT_DIR="release-site/Lattice-Releases/assets-${VERSION}"
        OUT="$OUT_DIR/index.md"
        mkdir -p "$OUT_DIR"

        # -- Windows binary mirror (bin-hex) --------------------------------
        # Windows installers and the checksum manifest are ALSO published as
        # static files on the release site, so the download table can link to
        # lattice-md.app instead of the GitHub Release CDN. Every other
        # platform keeps linking to the Release asset.
        # The files are copied from staging/ -- the same bytes step 904
        # uploaded, after any signing in 903.4 -- rather than re-downloaded:
        # no network round-trip and no race with the release going live.
        BIN_DIR="$OUT_DIR/bin-hex"
        mkdir -p "$BIN_DIR"
        # Alpha tags (ending in a non-digit, e.g. v1.2.3b) land on
        # alpha-releases; stable tags land on main. Must stay in sync with the
        # branch selection in the commit step below.
        DOCS_BRANCH=$(if [[ "$VERSION" =~ [^0-9]$ ]]; then echo "alpha-releases"; else echo "main"; fi)
        # Base URL for this release on GitHub Pages
        PAGES_BASE="https://lattice-md.app/Lattice-Releases/assets-${VERSION}"
        # Deferred antivirus dispatch list: name<TAB>url<TAB>served_from_pages
        SCAN_TARGETS="$RUNNER_TEMP/scan-targets.tsv"
        : > "$SCAN_TARGETS"

        # Microsoft Store badge. The Store listing (product 9PM3GB09941T) always
        # serves the current published version, so the markup is version-
        # independent and identical on every release page.
        # Three things this markup has to survive:
        #   1. printf -- the badge image URLs contain "%20", which printf would
        #      eat as a conversion spec. It is ALWAYS passed as an ARGUMENT to
        #      '%s\n', never as the format string.
        #   2. the release-site stylesheet -- Lattice-Releases/index.html sets
        #      "#content img { width: 100% }", which beats the width attribute.
        #      The inline style pins the badge to its intended 200px.
        #   3. light/dark -- <picture> serves Microsoft's white badge to dark
        #      readers and the dark badge otherwise. It follows the OS setting
        #      (prefers-color-scheme), which is also what the release page's
        #      theme button initialises from.
        MS_STORE_BADGE='<a href="https://get.microsoft.com/installer/download/9pm3gb09941t?referrer=appbadge" target="_self">'
        MS_STORE_BADGE+='<picture>'
        MS_STORE_BADGE+='   <source media="(prefers-color-scheme: dark)" srcset="https://get.microsoft.com/images/en-us%20light.svg">'
        MS_STORE_BADGE+='   <img src="https://get.microsoft.com/images/en-us%20dark.svg" width="200" '
        MS_STORE_BADGE+='    style="width:200px;max-width:100%;height:auto;display:inline-block" alt="Download Lattice from the Microsoft Store"/>'
        MS_STORE_BADGE+='</picture></a>'

        # Plain-text Store URL, for readers whose client drops the badge image
        MS_STORE_LINK='<p>With a browser, just jump to:<br>'
        MS_STORE_LINK+='<a href="https://apps.microsoft.com/detail/9pm3gb09941t">https://apps.microsoft.com/detail/9pm3gb09941t</a></p>'

        # Fetch asset download URLs from the GitHub Release API
        ASSETS_JSON=$(gh api repos/"${GITHUB_REPOSITORY}"/releases/tags/${VERSION} \
          --jq '.assets[] | [.name, .browser_download_url, .size] | @tsv')

        HTPAYLOAD=$(jq -nr \
          --arg repo "${GITHUB_REPOSITORY}" \
          '"https://api.github.com/repos/\($repo)/actions/workflows/AntivirusOnUrl.yml/dispatches"')

        printf 'HTTP payload is %s\n' "$HTPAYLOAD"

        # Header
        printf '%s\n' "# Lattice ${VERSION}"  > "$OUT"
        printf '%s\n' "**Released:** ${DATE}" >> "$OUT"
        printf '%s\n' "$( [ -f release-notes.md ] && cat release-notes.md )" >> "$OUT"
        printf '%s\n' "## Download Lattice"                  >> "$OUT"
        printf '%s\n' ""                                     >> "$OUT"
        printf '%s\n' "**Windows users: install from the Microsoft Store**" >> "$OUT"
        printf '%s\n' ""                                     >> "$OUT"
        printf '%s\n' "$MS_STORE_BADGE"                      >> "$OUT"
        printf '%s\n' ""                                     >> "$OUT"
        printf '%s\n' "$MS_STORE_LINK"                       >> "$OUT"
        printf '%s\n' ""                                     >> "$OUT"
        printf '%s\n' "Or download a package directly:"      >> "$OUT"
        printf '%s\n' ""                                     >> "$OUT"
        printf '%s\n' "| File | Install on | Size |"         >> "$OUT"
        printf '%s\n' "|:-----|:-----------|-----:|"         >> "$OUT"

        # One row per asset, size in MB
        while IFS=$'\t' read -r name url size_bytes; do
          size_mb=$(awk "BEGIN {printf \"%.1f MB\", $size_bytes/1048576}")

          # Derive a human-readable platform label from the filename
          case "$name" in
            *_aarch64.dmg)         platform='<span class="material-icons">laptop_mac</span> macOS — Apple Silicon (ARM64)' ;;
            *_x64.dmg)             platform='<span class="material-icons">laptop_mac</span> macOS — Intel (x86-64)' ;;
            *_x64-setup.exe)       platform='<span class="material-icons">window</span> Windows — Intel / AMD (x86-64)' ;;
            *_arm64-setup.exe)     platform='<span class="material-icons">window</span> Windows — ARM64' ;;
            *_aarch64-setup.exe)   platform='<span class="material-icons">window</span> Windows — ARM64' ;;
            *.msixbundle)          platform='<span class="material-icons">window</span> Windows — Store bundle (.msixbundle, sideload)' ;;
            *_amd64.AppImage)      platform='<span class="material-icons">terminal</span> Linux — x86-64 (AppImage)' ;;
            *_amd64.deb)           platform='<span class="material-icons">terminal</span> Linux — x86-64 (Debian / Ubuntu)' ;;
            *_aarch64.AppImage|*_arm64.AppImage)
                                   platform='<span class="material-icons">terminal</span> Linux — ARM64 (AppImage)' ;;
            *_arm64.deb)           platform='<span class="material-icons">terminal</span> Linux — ARM64 (Debian / Ubuntu)' ;;
            *.apk)                 platform='<span class="material-icons">android</span> Android — Universal' ;;
            *.aab)                 platform='<span class="material-icons">android</span> Android — Universal (Play Store)' ;;
            *.ipa)                 platform='<span class="material-icons">phone_iphone</span> iOS' ;;
            SHA256SUMS.txt)        platform='<span class="material-icons">tag</span> Checksums (SHA-256)' ;;
            SHA256SUMS.txt.asc)    platform='<span class="material-icons">key</span> Checksums - GPG signature' ;;
            THIRD-PARTY-NOTICES.md) platform='<span class="material-icons">gavel</span> Third-party licences and copyrights'
                                   NOTICES_URL="$url" ;;
            lattice-*.cdx.json)    platform="<span class=\"material-icons\">inventory_2</span> SBOM (CycloneDX) — ${name#lattice-}"
                                   platform="${platform%.cdx.json}" ;;
            *)                     platform='?' ;;
          esac

          # Windows installers and the checksum manifest are mirrored into
          # bin-hex/ and linked from the release site; everything else keeps
          # pointing at the GitHub Release asset URL.
          case "$name" in
            *-setup.exe|SHA256SUMS.txt|SHA256SUMS.txt.asc)
              if [ -f "staging/$name" ]; then
                cp -f "staging/$name" "$BIN_DIR/$name"
                dl_url="${PAGES_BASE}/bin-hex/${name}"
                on_pages=1
              else
                echo "::warning::$name is not in staging/ -- linking to the GitHub Release instead."
                dl_url="$url"
                on_pages=0
              fi
              ;;
            *)
              dl_url="$url"
              on_pages=0
              ;;
          esac

          printf '| [%s](%s) | %s | %s |\n' "$name" "$dl_url" "$platform" "$size_mb" >> "$OUT"

          # Text documents (licence notices, SBOMs) are nothing to scan.
          case "$name" in
            THIRD-PARTY-NOTICES.md|*.cdx.json) continue ;;
          esac

          # Antivirus scans are dispatched AFTER the release site is pushed:
          # a bin-hex URL does not resolve until the Pages deploy completes,
          # and AntivirusOnUrl.yml downloads the file it is handed.
          printf '%s\t%s\t%s\n' "$name" "$dl_url" "$on_pages" >> "$SCAN_TARGETS"

        done <<< "$ASSETS_JSON"

        # Footer
        printf '%s\n' "" >> "$OUT"
        printf '%s\n' "## Notes" >> "$OUT"
        printf '%s\n' "" >> "$OUT"
        printf '%s\n' "- [Full release on GitHub](${RELEASE_URL})" >> "$OUT"
        printf '%s\n' "- DUAL LICENSE — for terms, see [README.md section Licensing](https://github.com/${GITHUB_REPOSITORY}#licensing)." >> "$OUT"
        # REQ-LTTCE-FOS-00002 -- the same file every installer carries.
        if [ -n "${NOTICES_URL:-}" ]; then
          printf '%s\n' "- Third-party components and their licences: [THIRD-PARTY-NOTICES.md](${NOTICES_URL})." >> "$OUT"
        else
          echo "::warning::THIRD-PARTY-NOTICES.md is not among the release assets."
        fi
        printf '%s\n' "- Lattice collects no personal data — see the [Privacy Statement](${PRIVACY_URL})." >> "$OUT"
        printf '%s\n' "" >> "$OUT"

        # Copy the app logo into the release folder so the release page can use it,
        # and into the Lattice-Releases root so the favicon reference stays static.
        cp _src/public/lattice.svg "$OUT_DIR/lattice.svg"
        cp _src/public/lattice.svg "release-site/Lattice-Releases/lattice.svg"

        # Copy coverage HTML into the release folder so it is browseable
        COVERAGE_DIR="$OUT_DIR/coverage"
        mkdir -p "$COVERAGE_DIR"
        ls
        pwd
        ls ..
        cp -r ./coverage-html/. "$COVERAGE_DIR/"
        COVERAGE_URL="https://lattice-md.app/Lattice-Releases/assets-${VERSION}/coverage/"

        # Append coverage link to index.md
        printf '%s\n' "## Test Coverage" \
          "" \
          "- [BACKEND](${COVERAGE_URL}src-tauri/target/llvm-cov/html/)" \
          "- [FRONTEND](${COVERAGE_URL}coverage/)" \
          "" >> "$OUT"

        # ── Demo documents ──────────────────────────────────────────────────
        # Copy docs/demo/ from the lattice source tree into the release folder
        # so the docs are permanently versioned alongside each release.
        # The lattice source was sparse-checked-out into _src/ (see step 900.5a).
        DEMO_SRC="_src/docs/demo"
        DEMO_DEST="$OUT_DIR/docs/demo"
        if [ -d "$DEMO_SRC" ]; then
          mkdir -p "$DEMO_DEST"
          cp -r "$DEMO_SRC"/. "$DEMO_DEST/"
          echo "Demo docs copied to $DEMO_DEST"

          # PAGES_BASE and DOCS_BRANCH are set once near the top of this step.
          # Raw GitHub URL base (for "open as raw" links)
          RAW_BASE="https://raw.githubusercontent.com/blessia-blessini/lattice-docs-releases/${DOCS_BRANCH}/Lattice-Releases/assets-${VERSION}"
          # GitHub blob URL base (GitHub renders .md nicely)
          BLOB_BASE="https://github.com/blessia-blessini/lattice-docs-releases/blob/${DOCS_BRANCH}/Lattice-Releases/assets-${VERSION}"

          printf '%s\n' "## Demo Document" >> "$OUT"
          printf '%s\n' \
            "A Markdown file — open directly in Lattice, read on GitHub, or view as HTML/PDF here." \
            "" >> "$OUT"

          printf '%s\n\n' "### A document named \`demo.md\`" "" >> "$OUT"
          printf '%s\n' "- Only for reference, as [rendered by GitHub](${BLOB_BASE}/docs/demo/demo.md)" >> "$OUT"
          printf '%s\n' "- The plaintext that you would actually edit: [Raw .md](${RAW_BASE}/docs/demo/demo.md)" >> "$OUT"
          printf '%s\n' "" >> "$OUT"

          # ── What Lattice itself produced from that file ────────────────
          # Every desktop build in this run exported docs/demo/demo.md with
          # its OWN `--export-html` / `--export-pdf`, on its own OS, through
          # its own WebView (step 375). They are published side by side
          # rather than merged: the whole point is that a reader can see
          # what THEIR platform's build actually renders, and that a
          # regression on one platform is visible instead of hidden behind
          # another platform's output.
          #
          # The files are whatever step 901.6 downloaded — the loop is over
          # what actually arrived, so a platform dropped from the build
          # matrix disappears from the page by itself, with no list here to
          # keep in sync.
          GEN_SRC="demo-export"

          # Human-readable heading for a matrix platform, shared by the
          # screenshot and the generated-documents sections below. Mirrors
          # the download-table labels above; an unknown platform still gets
          # a usable heading rather than being skipped.
          platform_heading() {
            case "$1" in
              windows-desktop)     echo '<span class="material-icons">window</span> Windows — Intel / AMD (x86-64)' ;;
              windows-arm-desktop) echo '<span class="material-icons">window</span> Windows — ARM64' ;;
              macos-arm64)         echo '<span class="material-icons">laptop_mac</span> macOS — Apple Silicon (ARM64)' ;;
              macos-intel)         echo '<span class="material-icons">laptop_mac</span> macOS — Intel (x86-64)' ;;
              linux-desktop)       echo '<span class="material-icons">terminal</span> Linux — x86-64' ;;
              linux-arm-desktop)   echo '<span class="material-icons">terminal</span> Linux — ARM64' ;;
              *)                   echo "$1" ;;
            esac
          }

          # ── What Lattice looks like on each desktop ────────────────────
          # One screenshot of the running release app per desktop build
          # (examples/app_screenshot.rs, build-test step 1e), shipped in the
          # same DEMO-EXPORT-<platform> artifact as the documents. Same
          # rule as below: the loop is over what arrived, so a leg that
          # produced no screenshot simply has no entry.
          if compgen -G "$GEN_SRC/screenshot-*.png" > /dev/null; then
            SHOT_DEST="$DEMO_DEST/screenshots"
            mkdir -p "$SHOT_DEST"
            cp -f "$GEN_SRC"/screenshot-*.png "$SHOT_DEST/"
            printf '%s\n' "### Lattice on each desktop" "" >> "$OUT"
            printf '%s\n' \
              "Each desktop build in this release started the app it built, opened \`demo.md\`" \
              "and took one screenshot of its main window — what you get on that platform." \
              "" >> "$OUT"
            for shot in $(ls "$GEN_SRC"/screenshot-*.png 2>/dev/null | sort); do
              name=$(basename "$shot")
              plat="${name#screenshot-}"; plat="${plat%.png}"
              printf '%s\n\n' "#### $(platform_heading "$plat")" >> "$OUT"
              printf '![Lattice on %s](%s/docs/demo/screenshots/%s)\n\n' "$plat" "$RAW_BASE" "$name" >> "$OUT"
            done
          else
            echo "::warning::No app screenshots were downloaded — the release page will not show them."
          fi

          if compgen -G "$GEN_SRC/demo-*.pdf" > /dev/null || compgen -G "$GEN_SRC/demo-*.html" > /dev/null; then
            GEN_DEST="$DEMO_DEST/generated"
            mkdir -p "$GEN_DEST"
            cp -f "$GEN_SRC"/demo-* "$GEN_DEST/"
            GEN_RAW="${RAW_BASE}/docs/demo/generated"
            # Same files, addressed through the site instead of raw.github —
            # and deliberately RELATIVE, with no scheme and no host.
            #
            # Two reasons, and both matter:
            #
            # 1. raw.githubusercontent.com serves every file as
            #    `text/plain` with `X-Content-Type-Options: nosniff`, so an
            #    .html opened from there shows its SOURCE, never the rendered
            #    page. The PDF is unaffected (PDF.js fetches bytes), which is
            #    why only the HTML link needs this.
            # 2. A relative link binds to whatever host served the page, so
            #    renaming the site — lattice-md.app today, something else
            #    tomorrow — cannot break it. That is why this does not use
            #    PAGES_BASE, which hard-codes the current domain.
            #
            # index.md is always rendered by /Lattice-Releases/index.html (the
            # site root redirects there), so a path relative to that directory
            # is what resolves correctly, exactly as `pdf-viewer.html?file=`
            # above already relies on.
            GEN_SITE="assets-${VERSION}/docs/demo/generated"

            printf '%s\n' "### Generated by Lattice itself" "" >> "$OUT"
            printf '%s\n' \
              "Each desktop build in this release exported \`demo.md\` on its own operating" \
              "system, through that platform's own WebView. Nothing below was produced by" \
              "hand or by a converter — it is the output of the same \`--export-html\` and" \
              "\`--export-pdf\` commands you can run yourself:" \
              "" >> "$OUT"
            printf '%s\n' '```sh' "lattice --export-html demo.md" "lattice --export-pdf demo.md                 # A4" \
              "lattice --export-pdf --paper a3 demo.md      # or: --paper letter" '```' "" >> "$OUT"

            # Iterate the default-paper (A4) PDFs; the matching HTML and the
            # other papers are linked alongside each. Sorted so the page order
            # is stable release to release.
            #
            # export_demo publishes the other papers as demo-<platform>.<paper>.pdf
            # (a3, letter). One is recognised by its parent existing: strip the
            # last ".<part>" and if demo-<platform>.pdf is there, this is an extra
            # paper of that platform — skip it here and link it under its
            # platform below. No paper list to keep in sync with paper.rs, and a
            # platform label that itself contains a dot (say "ubuntu-24.04") is
            # still embedded, because no "demo-ubuntu-24.pdf" exists.
            for pdf in $(ls "$GEN_SRC"/demo-*.pdf 2>/dev/null | sort); do
              base=$(basename "$pdf" .pdf)          # demo-<platform>
              case "$base" in *.*) [ -f "$GEN_SRC/${base%.*}.pdf" ] && continue ;; esac
              plat="${base#demo-}"                  # <platform>

              printf '%s\n\n' "#### $(platform_heading "$plat")" >> "$OUT"

              PDF_RAW="${GEN_RAW}/${base}.pdf"
              # URL-encode the full PDF URL so it is safe as a query parameter value.
              PDF_ENC=$(jq -rn --arg str "$PDF_RAW" '$str | @uri')
              # pdf-viewer.html (PDF.js, Apache 2.0) lives in Lattice-Releases/
              # and accepts ?file=<encoded-url>. Emit an iframe — marked.js
              # passes raw HTML through, so this renders inline.
              printf '<iframe src="pdf-viewer.html?file=%s" width="100%%" style="border:none;border-radius:4px;margin:12px 0;display:block;min-height:70vh"></iframe>\n\n' \
                "$PDF_ENC" >> "$OUT"

              printf -- '- Download [Lattice-generated PDF, A4](%s)\n' "$PDF_RAW" >> "$OUT"
              for extra in $(ls "$GEN_SRC/${base}".*.pdf 2>/dev/null | sort); do
                paper=$(basename "$extra" .pdf); paper="${paper##*.}"    # a3, letter
                label=$(printf '%s' "$paper" | tr '[:lower:]' '[:upper:]')
                [ "$paper" = "letter" ] && label="US Letter"
                printf -- '- Download [Lattice-generated PDF, %s](%s/%s)\n' \
                  "$label" "$GEN_RAW" "$(basename "$extra")" >> "$OUT"
              done
              if [ -f "$GEN_SRC/${base}.html" ]; then
                printf -- '- Open the [Lattice-generated HTML](%s/%s.html)\n' "$GEN_SITE" "$base" >> "$OUT"
              fi
              printf '%s\n' "" >> "$OUT"
            done
          else
            echo "::warning::No Lattice-generated demo documents were downloaded — the release page will not show them."
          fi

          printf '\n' >> "$OUT"
          # Embed screenshots from demo_assets/ inline — left-aligned, full pixel quality.
          # GitHub renders images from raw.githubusercontent.com directly in Markdown.
          ASSETS_SRC="$DEMO_SRC/demo_assets"
          if [ -d "$ASSETS_SRC" ]; then
            for img in "$ASSETS_SRC"/*.png; do
              [ -f "$img" ] || continue
              FNAME=$(basename "$img")
              printf '![Lattice demo screenshot](%s/docs/demo/demo_assets/%s)\n\n' "$RAW_BASE" "$FNAME" >> "$OUT"
            done
          fi

          printf '\n' >> "$OUT"
        else
          echo "Warning: $DEMO_SRC not found — skipping demo docs copy."
        fi
        # ────────────────────────────────────────────────────────────────────

        # Commit index.md + coverage HTML to the release site.
        # Tags ending in a non-digit (e.g. v1.2.3a, v1.2.3-beta) go to
        # the alpha-releases branch; stable tags go to main.
        cd release-site
        git config user.name  "GitHub Actions"
        git config user.email "actions@github.com"

        if [[ "$VERSION" =~ [^0-9]$ ]]; then
          TARGET_BRANCH="alpha-releases"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" > /dev/null 2>&1; then
            git checkout "$TARGET_BRANCH"
            git pull --ff-only origin "$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH" origin/main
          fi
        else
          TARGET_BRANCH="main"
        fi

        git add Lattice-Releases/ THIRD_PARTY_LICENSES.md
        git commit -m "Release ${VERSION}: add index.md and coverage reports" \
          -m "Co-authored-by: Blessia-Blessini <273819958+blessia-blessini@users.noreply.github.com>"
        git push origin "$TARGET_BRANCH"
        cd ..

        ################################################################
        # Antivirus scans -- dispatched now that bin-hex/ is published.
        # Assets served from the release site need the Pages deploy to
        # finish first, so poll one of those URLs before dispatching.
        ################################################################
        if awk -F'\t' '$3 == 1 {found=1} END {exit !found}' "$SCAN_TARGETS"; then
          FIRST_PAGES_URL=$(awk -F'\t' '$3 == 1 {print $2; exit}' "$SCAN_TARGETS")
          echo "Waiting for GitHub Pages to serve ${FIRST_PAGES_URL}"
          for _ in $(seq 1 60); do
            if curl -sfIL -o /dev/null "$FIRST_PAGES_URL"; then
              echo "Pages deploy is live."
              break
            fi
            sleep 20
          done
          curl -sfIL -o /dev/null "$FIRST_PAGES_URL" \
            || echo "::warning::${FIRST_PAGES_URL} still not served after ~20 min; dispatching scans anyway."
        fi

        while IFS=$'\t' read -r name dl_url _on_pages; do
          [ -n "$name" ] || continue

          PAYLOAD=$(jq -nc \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg url "$dl_url" \
            --arg who "$name" \
            '{ref: $ref, inputs: {url2scan: $url, submitted_by: $who}}')

          RESPONSE=$(curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN2" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$HTPAYLOAD" \
            -d "$PAYLOAD")

          echo "### response from triggering Antivirus scan workflow for ${name}: (may be empty) "
          echo "$RESPONSE" | jq .
        done < "$SCAN_TARGETS"

    ################################################################
    # 906 / Write job summary
    ################################################################
    - name: 906. Summary
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        echo "### Release published" >> $GITHUB_STEP_SUMMARY
        echo " - GitHub Release: ${RELEASE_URL}" >> $GITHUB_STEP_SUMMARY
        echo " - Release page: https://lattice-md.app/Lattice-Releases/assets-${VERSION}/" >> $GITHUB_STEP_SUMMARY
        echo " - Coverage report: https://lattice-md.app/Lattice-Releases/assets-${VERSION}/coverage/" >> $GITHUB_STEP_SUMMARY

  ################################################################################################################################
  ################################################################################################################################
  # JOB 5: BRING THE RELEASED NOTICES BACK TO DEV  (tag vX.Y.Z, after publishing; REQ-LTTCE-FOS-00009)
  #   The installers carry the notices of this release's deep scan, which
  #   may be newer than those committed. If they differ, this opens a pull
  #   request into dev with foss/notice-additions.json and the two notices
  #   files exactly as released, so nobody has to remember it; merging it
  #   is the maintainer's approval. Re-running is safe: a pull request of the
  #   same release in any state, or its pushed branch, is reused, never
  #   overwritten or opened twice.
  #   Needs the repository setting "Allow GitHub Actions to create and
  #   approve pull requests". Pull requests made with GITHUB_TOKEN start no
  #   workflows; the files were checked by this run already.
  ################################################################################################################################
  notices-to-dev:
    needs: [setup, foss-scan, publish-release-site]
    if: >-
      !cancelled() && needs.setup.outputs.kind == 'release'
      && needs.publish-release-site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the pull request
    steps:
    - name: 950. Checkout (the released commit)
      uses: actions/checkout@v6

    - name: 951. Install Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: 952a. Get the deep scan's results
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.foss-scan.outputs.results_artifact }}
        path: legattice-results

    - name: 952b. Get the released notices
      uses: actions/download-artifact@v8
      with:
        name: release-notices
        path: .

    - name: 953. Did the notice additions change?
      id: compare
      run: node scripts/foss/foss.mjs compare-additions --fresh legattice-results/topics/notice-additions.json

    - name: 954. Open the pull request into dev
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ADDITIONS_CHANGED: ${{ steps.compare.outputs.changed }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        NOTICES="THIRD-PARTY-NOTICES.md src/lib/export-notices.generated.txt"
        # shellcheck disable=SC2086
        if [ "$ADDITIONS_CHANGED" != "true" ] && git diff --quiet -- $NOTICES; then
          echo "The released notices are the committed ones: nothing to bring back."
          echo "### Notices: dev is up to date" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        BRANCH="foss-notices-${TAG}"
        # Any state: open (waiting), merged (done) or closed (the maintainer
        # declined it) -- a re-run never opens a second one.
        EXISTING=$(gh pr list --base dev --head "$BRANCH" --state all --json state,url --jq '.[0] // empty | "\(.state) \(.url)"')
        if [ -n "$EXISTING" ]; then
          echo "Pull request for this release already exists: $EXISTING"
          echo "### Notices: pull request into dev already exists ($EXISTING)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
          cp legattice-results/topics/notice-additions.json foss/notice-additions.json
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git switch -c "$BRANCH"
          # shellcheck disable=SC2086
          git add foss/notice-additions.json $NOTICES
          git commit -m "CHORE: Bring the notices released in ${TAG} back to dev" \
            -m "The installers of ${TAG} carry the notices of its deep scan (REQ-LTTCE-FOS-00009); this commits them as released." \
            -m "Co-authored-by: Blessia-Blessini <273819958+blessia-blessini@users.noreply.github.com>"
          git push origin "$BRANCH"
        fi
        URL=$(gh pr create --base dev --head "$BRANCH" \
          --title "CHORE: Bring the notices released in ${TAG} back to dev" \
          --body "The installers of ${TAG} carry the third-party notices of its deep scan. This brings \`foss/notice-additions.json\`, \`THIRD-PARTY-NOTICES.md\` and \`src/lib/export-notices.generated.txt\` to dev exactly as released. Made by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.")
        echo "Opened $URL"
        echo "### Notices: pull request into dev opened: $URL" >> "$GITHUB_STEP_SUMMARY"
