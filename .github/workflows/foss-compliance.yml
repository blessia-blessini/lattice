################################################################
# FOSS COMPLIANCE (REQ-LTTCE-FOS-00002 / 00004 / 00007)
#   Licence gate over every target's Rust graph and the npm
#   production closure (foss/policy.json: fits AGPL-3.0-or-later
#   AND the commercial licence), the notices drift check, the
#   tooling's unit tests, the vulnerability audit (blocking on a
#   release tag only) and, in a build, one CycloneDX SBOM per
#   built target. One definition, three ways in:
#   - called by "Build and Test Matrix" (job foss-compliance), in
#     parallel with the build legs; publish-release-site needs it,
#     so a release that breaks the policy is never published.
#     Only this way writes the SBOMs (input sbom, default true);
#   - on every pull request to dev, Dependabot's included, so a
#     dependency update that changes the notices is caught before
#     it is merged (FU-8: katex, PR #39);
#   - on every push to dev, so what the maintainer integrates
#     directly (pull requests are for outside contributors) is
#     checked too. It cannot stop that push, it reports right
#     after it: a red check on the commit.
#   It only reads: a failure says in the job summary what to run
#   and commit.
#   No cache on purpose: it only downloads sources (~1 min), and
#   the 10 GB cache budget already evicts on every run.
#   No concurrency group: when called, github.workflow is the
#   caller's name, and a shared group would deadlock with it.
################################################################
name: FOSS Compliance

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      sbom:
        description: 'Write and upload the SBOMs (artifact FOSS) for the release'
        type: boolean
        default: true
      fresh_additions:
        description: 'Tag with the deep scan (REQ-LTTCE-FOS-00009): artifact of the deep scan of this commit; its notice additions replace the committed ones, the notices are regenerated and uploaded as release-notices'
        type: string
        default: ''
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  foss-compliance:
    runs-on: ubuntu-latest
    steps:
    - name: 100. Checkout
      uses: actions/checkout@v6

    - name: 123. Install Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    # --ignore-scripts: no code of a dependency runs here, which matters
    # on a pull request that brings a new version of one.
    - name: 130. Fetch sources (all crates, npm production packages)
      id: fetch
      shell: bash
      run: |
        set -euo pipefail
        cargo fetch --locked --manifest-path src-tauri/Cargo.toml
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    ################################################################
    # 135 / Tags with the deep scan only (REQ-LTTCE-FOS-00009):
    #       the deep scan of this commit, run before this job, decided
    #       what the notices add; its file replaces the committed one for
    #       everything below, so gate, notices and SBOMs use it.
    ################################################################
    - name: 135a. Get the deep scan's results
      if: inputs.fresh_additions
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.fresh_additions }}
        path: legattice-results

    - name: 135b. Use its notice additions
      if: inputs.fresh_additions
      shell: bash
      run: |
        set -euo pipefail
        cp legattice-results/topics/notice-additions.json foss/notice-additions.json
        node -e "const a=require('./foss/notice-additions.json'); console.log('notice additions from', JSON.stringify(a.source), '-', a.additions.length, 'additions')"

    # On a v* tag (a release or a rehearsal, REQ-LTTCE-FOS-00009) --block also
    # fails on notice additions for versions no longer shipped (REQ-LTTCE-FOS-00008).
    - name: 140. Licence gate
      shell: bash
      env:
        GATE_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && '--block' || '' }}
      run: node scripts/foss/foss.mjs check $GATE_MODE

    # 141 and 144 also run after a failed gate, so one run reports everything.
    - name: 141. Third-party notices up to date
      if: (success() || failure()) && steps.fetch.outcome == 'success' && !inputs.fresh_additions
      run: node scripts/foss/foss.mjs notices --check

    # With fresh additions the committed notices are older by design: they are
    # regenerated here, and the build legs ship these (REQ-LTTCE-FOS-00009).
    - name: 141a. Regenerate the notices from the fresh additions
      if: inputs.fresh_additions
      run: node scripts/foss/foss.mjs notices

    - name: 141b. Upload the release notices
      if: inputs.fresh_additions
      uses: actions/upload-artifact@v7
      with:
        name: release-notices
        path: |
          THIRD-PARTY-NOTICES.md
          src/lib/export-notices.generated.txt
        if-no-files-found: error

    # 142/143 only when called by a build: inputs exist only for
    # workflow_call, so on a pull request or a push to dev inputs.sbom
    # is empty. github.event_name cannot tell them apart -- a called
    # workflow sees the caller's event, and builds start on push too.
    - name: 142. SBOMs (CycloneDX, one per built target)
      if: inputs.sbom
      shell: bash
      run: |
        set -euo pipefail
        # Every target of the build matrix except iOS, which is not built yet.
        node scripts/foss/foss.mjs sbom --out-dir foss-out --targets \
          x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,aarch64-linux-android
        cp THIRD-PARTY-NOTICES.md foss-out/
        ls -l foss-out

    - name: 143. Upload FOSS compliance files
      if: inputs.sbom
      uses: actions/upload-artifact@v7
      with:
        name: FOSS
        path: foss-out/
        if-no-files-found: error

    ################################################################
    # 144 / Unit tests of scripts/foss/ (*.test.mjs). Here, not in
    #       the build legs: those check out without scripts/foss/
    #       (build-and-test step 100). After 140-142, so the gate
    #       reads the production-only node_modules it was built for.
    ################################################################
    - name: 144. FOSS tooling unit tests
      if: (success() || failure()) && steps.fetch.outcome == 'success'
      shell: bash
      env:
        LATTICEBUILD_NO: FOSS-unit-tests
      run: |
        set -euo pipefail
        npm ci --ignore-scripts --no-audit --no-fund
        npx vitest run scripts/foss

    ################################################################
    # 145 / Vulnerability audit (REQ-LTTCE-FOS-00007): npm audit
    #       (GitHub advisory database) and cargo audit (RustSec)
    #       against the shipped components. Reports only -- job
    #       summary and annotations -- except on a release tag, where
    #       a vulnerable shipped component without an exception in
    #       foss/advisory-exceptions.json, or an audit that could not
    #       run, fails the job and so blocks publish-release-site.
    #       cargo-audit is its release binary, pinned by version and
    #       SHA-256 (no build, no third-party action). A failed
    #       install is left to the audit: "not audited" warns here
    #       and blocks only a release.
    ################################################################
    - name: 145. Vulnerability audit (npm, RustSec)
      if: (success() || failure()) && steps.fetch.outcome == 'success'
      shell: bash
      env:
        CARGO_AUDIT_VERSION: '0.22.2'
        CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        AUDIT_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && '--block' || '' }}
      run: |
        set -uo pipefail
        name="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
        if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tgz" \
             "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/$name.tgz" \
           && echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/$name.tgz" | sha256sum -c --quiet - \
           && tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP" \
           && install -D -m 755 "$RUNNER_TEMP/$name/cargo-audit" "$HOME/.cargo/bin/cargo-audit"; then
          cargo audit --version
        else
          echo "::warning::cargo-audit ${CARGO_AUDIT_VERSION} could not be installed"
        fi
        node scripts/foss/foss.mjs audit $AUDIT_MODE
